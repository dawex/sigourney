name: Release

on:
  push:
    tags: [ "v*" ]

env:
  JAVA_VERSION: '17'
  JAVA_DISTRO: 'temurin'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Publish package
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_NEXUS2_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_NEXUS2_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B deploy jreleaser:deploy --file trust-framework/pom.xml -pl :sigourney-trustframework -P release -DaltDeploymentRepository=local::default::file:./trust-framework/target/staging-deploy
          mvn -B deploy jreleaser:deploy --file trust-framework/pom.xml -pl verifiable-credentials-core,verifiable-credentials-model -P release -DaltDeploymentRepository=local::default::file:./trust-framework/target/staging-deploy

      - name: JReleaser output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-output
          path: |
            trust-framework/target/jreleaser/trace.log
            trust-framework/target/jreleaser/output.properties
            trust-framework/*/target/jreleaser/trace.log
            trust-framework/*/target/jreleaser/output.properties
